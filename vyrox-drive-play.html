<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090d"><title>VYROX DRIVE — Playable Test Drive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Manrope:wght@400;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;color:#fff;font-family:Manrope,Arial,sans-serif}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:3;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font:900 25px 'Barlow Condensed';letter-spacing:2px;text-shadow:0 3px 12px #000}.brand span{color:#ff6b24}.hud{display:flex;gap:8px;align-items:center}.chip,.action{background:#090e16d9;border:1px solid #ffffff30;color:white;border-radius:5px;padding:9px 12px;font-size:10px;font-weight:900;letter-spacing:1px;backdrop-filter:blur(10px)}.action{cursor:pointer;pointer-events:auto}.action:hover,.action.active{border-color:#ff6b24;color:#ffad83}.speed{position:fixed;right:20px;bottom:20px;background:#080d16dd;border:1px solid #ffffff30;border-radius:9px;padding:12px 18px;text-align:right;z-index:3;min-width:120px}.speed strong{font:900 46px/.9 'Barlow Condensed';display:block}.speed small{font-size:9px;letter-spacing:2px;color:#ffad83}.help{position:fixed;left:18px;bottom:18px;z-index:3;max-width:280px;background:#080d16c9;border:1px solid #ffffff22;border-radius:7px;padding:11px 13px;color:#cbd3df;font-size:10px;line-height:1.7}.touch{position:fixed;z-index:4;bottom:22px;left:50%;transform:translateX(-50%);display:none;gap:10px;align-items:end}.pad{display:grid;grid-template-columns:repeat(2,62px);gap:7px}.pedals{display:grid;gap:7px}.touch button{width:62px;height:58px;border:1px solid #ffffff55;background:#0a101bdc;color:#fff;border-radius:8px;font-weight:900;touch-action:none}.touch button:active{background:#ff6b24;color:#111}.pedals button{height:68px}.notice{position:fixed;z-index:3;top:60px;left:16px;color:#e2e7ee;font-size:9px;letter-spacing:1.5px;text-shadow:0 2px 8px #000}.back{position:fixed;z-index:5;top:64px;right:16px;text-decoration:none;color:#fff;background:#101722dd;border:1px solid #ffffff30;border-radius:5px;padding:9px 12px;font-size:10px;font-weight:900}@media(max-width:700px){.touch{display:flex}.help{bottom:170px;max-width:220px}.speed{bottom:170px}.hud{gap:4px}.chip{display:none}.action{padding:9px 8px;font-size:9px}.brand{font-size:20px}}@media(min-width:701px){.help{bottom:18px}}
</style></head><body><div id="stage"></div>
<div class="top"><div class="brand">VYROX <span>DRIVE</span></div><div class="hud"><span class="chip">3D TEST DRIVE · BUILD 01</span><button class="action" id="sound">SOUND: OFF</button><button class="action" id="lights">LIGHTS</button><button class="action" id="camera">CAMERA</button><button class="action" id="reset">RESET</button></div></div>
<div class="notice">BEYOND SPEED. BEYOND LIMITS.</div><a class="back" href="vyrox-drive.html">GARAGE ↗</a>
<div class="help"><b>KEYBOARD</b><br>W / ↑ accelerate · S / ↓ brake · A D / ← → steer<br>SPACE handbrake · C camera · L headlights · R reset<br><span style="color:#ffad83">Game-only driving simulation.</span></div>
<div class="speed"><strong id="speed">000</strong><small>KM/H · SIMULATED</small></div>
<div class="touch"><div class="pad"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="Space">DRIFT</button><button data-key="KeyC">CAM</button></div><div class="pedals"><button data-key="ArrowUp">ACCEL</button><button data-key="ArrowDown">BRAKE</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b8d2);scene.fog=new THREE.Fog(0x91b8d2,75,260);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x34402b,2));const sun=new THREE.DirectionalLight(0xfff1d7,3);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x4a634d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(16,420),new THREE.MeshStandardMaterial({color:0x252a30,roughness:.94}));road.rotation.x=-Math.PI/2;road.position.set(0,0,-100);road.receiveShadow=true;scene.add(road);
const lineMat=new THREE.MeshBasicMaterial({color:0xf3e6b9});for(let z=100;z>-310;z-=12){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.18,.025,5),lineMat);stripe.position.set(0,.025,z);scene.add(stripe)}
for(const x of [-8.1,8.1]){const edge=new THREE.Mesh(new THREE.BoxGeometry(.22,.08,420),new THREE.MeshStandardMaterial({color:0xff6b24}));edge.position.set(x,.04,-100);scene.add(edge)}
const buildings=[];for(let i=0;i<85;i++){const side=i%2?1:-1;const h=5+Math.random()*22,w=4+Math.random()*7;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,5+Math.random()*7),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.56+Math.random()*.08,.12,.18+Math.random()*.18),roughness:.8}));b.position.set(side*(17+Math.random()*34),h/2,-i*5-8);b.castShadow=true;b.receiveShadow=true;scene.add(b);buildings.push(b)}
const car=new THREE.Group();scene.add(car);const paint=new THREE.MeshPhysicalMaterial({color:0xb7bec8,metalness:.85,roughness:.22,clearcoat:1,clearcoatRoughness:.1});const dark=new THREE.MeshStandardMaterial({color:0x111820,metalness:.55,roughness:.35});const glass=new THREE.MeshPhysicalMaterial({color:0x172b3b,metalness:.35,roughness:.12,transparent:true,opacity:.88});
function box(parent,w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
box(car,2.05,.52,4.35,paint,0,.82,0);box(car,1.65,.62,1.9,paint,0,1.35,-.25);box(car,1.52,.46,1.65,glass,0,1.42,-.25);box(car,2.02,.12,1.1,dark,0,.65,1.58);box(car,2.1,.13,.8,dark,0,.66,-1.55);
for(const x of [-1,1]){box(car,.12,.12,.5,new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xaaaaaa}),x,.85,2.18);box(car,.12,.12,.5,new THREE.MeshStandardMaterial({color:0xff1800,emissive:0x6b0000}),x,.85,-2.18)}
const wheels=[];for(const x of [-1.08,1.08])for(const z of [-1.35,1.38]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,24),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);wheel.castShadow=true;car.add(wheel);wheels.push(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.29,16),new THREE.MeshStandardMaterial({color:0x9ca3af,metalness:.8,roughness:.25}));hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);car.add(hub)}
car.position.set(0,0,7);
const keys={};let velocity=0,steer=0,drift=0,heading=0,camMode=0,lights=false,audio=false,ctx=null,osc=null,gain=null;
function setLight(){lights=!lights;document.querySelector('#lights').classList.toggle('active',lights);car.children.filter(x=>x.material&&x.material.emissive).forEach(x=>{if(x.material.color.getHex()===0xffffff)x.material.emissive.setHex(lights?0xffffff:0xaaaaaa)})}
function reset(){velocity=0;steer=0;drift=0;heading=0;car.position.set(0,0,7);car.rotation.y=0}
function toggleAudio(){audio=!audio;document.querySelector('#sound').textContent='SOUND: '+(audio?'ON':'OFF');if(audio&&!ctx){ctx=new AudioContext();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sawtooth';osc.frequency.value=65;gain.gain.value=0;osc.connect(gain);gain.connect(ctx.destination);osc.start()}if(ctx){if(audio)ctx.resume();gain.gain.setTargetAtTime(audio ? 0.035 : 0,ctx.currentTime,.08)}}
function bind(key,down){keys[key]=down}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!keys[e.code]){if(e.code==='KeyC')camMode=(camMode+1)%3;if(e.code==='KeyL')setLight();if(e.code==='KeyR')reset()}bind(e.code,true)});
addEventListener('keyup',e=>bind(e.code,false));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();bind(k,true);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>bind(k,false)))});
document.querySelector('#camera').onclick=()=>camMode=(camMode+1)%3;document.querySelector('#lights').onclick=setLight;document.querySelector('#reset').onclick=reset;document.querySelector('#sound').onclick=toggleAudio;
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const forward=keys.KeyW||keys.ArrowUp,back=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight,hand=keys.Space;
if(forward)velocity=Math.min(velocity+26*dt,65);else if(back)velocity=Math.max(velocity-48*dt,-12);else velocity*=Math.pow(.985,dt*60);
const steerInput=(right?1:0)-(left?1:0);steer=THREE.MathUtils.damp(steer,steerInput,5,dt);const speedFactor=Math.min(Math.abs(velocity)/18,1);heading-=steer*speedFactor*(hand?1.65:1.05)*dt*(velocity>=0?1:-1);drift=THREE.MathUtils.damp(drift,hand&&Math.abs(velocity)>8?steer*.48:0,3,dt);
car.rotation.y=heading+drift*.18;car.position.x+=Math.sin(heading)*velocity*dt*.22;car.position.z-=Math.cos(heading)*velocity*dt*.22;car.position.x=THREE.MathUtils.clamp(car.position.x,-6.1,6.1);
wheels.forEach(w=>w.rotation.x+=velocity*dt*1.8);const target=new THREE.Vector3(car.position.x,car.position.y+2.0,car.position.z);
if(camMode===0){const offset=new THREE.Vector3(0,5.2,10).applyAxisAngle(new THREE.Vector3(0,1,0),heading);camera.position.lerp(target.clone().add(offset),1-Math.pow(.001,dt));camera.lookAt(car.position.x,1,car.position.z-5)}
else if(camMode===1){camera.position.set(car.position.x,2.0,car.position.z+.2);camera.lookAt(car.position.x,1.5,car.position.z-12)}
else{const offset=new THREE.Vector3(8,3.5,7).applyAxisAngle(new THREE.Vector3(0,1,0),heading);camera.position.lerp(target.clone().add(offset),1-Math.pow(.001,dt));camera.lookAt(car.position)}
document.querySelector('#speed').textContent=String(Math.round(Math.abs(velocity)*3.6)).padStart(3,'0');if(audio&&ctx)osc.frequency.setTargetAtTime(55+Math.abs(velocity)*3.3,ctx.currentTime,.05);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
