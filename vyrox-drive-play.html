\nconst car=new THREE.Group();scene.add(car);const paint=new THREE.MeshPhysicalMaterial({color:0x9ba8b8,metalness:.92,roughness:.16,clearcoat:1,clearcoatRoughness:.045});const dark=new THREE.MeshStandardMaterial({color:0x111820,metalness:.55,roughness:.35});const glass=new THREE.MeshPhysicalMaterial({color:0x172b3b,metalness:.35,roughness:.12,transparent:true,opacity:.88});

box(car,2.08,.2,4.42,paint,0,.78,0);box(car,1.98,.25,3.5,paint,0,.94,-.05);box(car,1.68,.57,1.9,paint,0,1.29,-.38);box(car,1.58,.43,1.72,glass,0,1.37,-.38);box(car,1.94,.08,1.45,dark,0,.69,1.62);box(car,2.14,.13,.85,dark,0,.65,-1.72);box(car,1.8,.08,.5,paint,0,1.12,-2.05);box(car,.12,.36,.1,paint,-.88,1.12,.75);box(car,.12,.36,.1,paint,.88,1.12,.75);box(car,2.05,.1,.16,dark,0,1.30,-1.42);box(car,1.25,.18,.12,dark,0,.77,-2.22);box(car,.72,.11,.1,paint,0,.91,2.18);for(const x of [-.62,.62]){box(car,.28,.1,.24,dark,x,.72,-2.13);box(car,.18,.12,.28,paint,x,.83,-2.12)}

const wheels=[];const frontWheels=[];const rimMat=new THREE.MeshStandardMaterial({color:0xb7c5d7,metalness:1,roughness:.18});for(const x of [-1.08,1.08])for(const z of [-1.35,1.38]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.32,32),new THREE.MeshStandardMaterial({color:0x080b10,roughness:.82}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);wheel.castShadow=true;car.add(wheel);wheels.push(wheel);if(z<0)frontWheels.push(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.34,24),rimMat);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);car.add(hub);for(let j=0;j<10;j++){const spoke=new THREE.Mesh(new THREE.BoxGeometry(.045,.045,.27),rimMat);spoke.position.set(x+Math.sign(x)*.18,.48,z);spoke.rotation.x=j*Math.PI/5;spoke.rotation.z=Math.PI/2;car.add(spoke)}const disc=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.035,32),new THREE.MeshStandardMaterial({color:0x525b67,metalness:.8,roughness:.32}));disc.rotation.z=Math.PI/2;disc.position.set(x-Math.sign(x)*.18,.48,z);car.add(disc)}

const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const rp=rain.geometry.attributes.position;for(let i=0;i<rainCount;i++){let y=rp.array[i*3+1]-dt*25;if(y<0)y=24;rp.array[i*3+1]=y;rp.array[i*3]+=dt*1.8}rp.needsUpdate=true;const forward=keys.KeyW||keys.ArrowUp,back=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight,hand=keys.Space;

else if(camMode===1){camera.position.set(car.position.x,2.0,car.position.z+.2);camera.lookAt(car.position.x,1.5,car.position.z-12)}
